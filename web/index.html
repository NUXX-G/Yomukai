<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Manga, manhwa, novelas, cómics y anime de tus fuentes, en una sola app." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Solid black status bar: the page starts below it. The see-through one let Safari 26 put the top bars under the clock, hidden and untappable. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Yomukai" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Yomukai</title>
    <!-- Loading screen (ESTILO.md): a strip of panels that drop in one by one, speed lines, and the 読 seal in the last
         one. Plain CSS, no script; main.js fades it out as soon as the app is on screen. -->
    <style>
      html,body{background:#0a0a0a;margin:0}
      #splash{position:fixed;inset:0;z-index:999;display:grid;place-items:center;background:#0a0a0a;transition:opacity .25s;
        background-image:repeating-conic-gradient(from 0deg at 50% 46%,rgba(245,245,242,.05) 0 2deg,transparent 2deg 9deg)}
      #splash.out{opacity:0;pointer-events:none}
      #splash .strip{display:grid;grid-template-columns:repeat(2,44px);grid-template-rows:repeat(2,58px);gap:8px}
      #splash i{border:2.5px solid #f5f5f2;border-radius:4px;background:#181818;box-shadow:4px 4px 0 #f5f5f2;
        animation:drop .42s cubic-bezier(.2,1.5,.4,1) both}
      #splash i:nth-child(2){animation-delay:.12s;background:#f5f5f2}
      #splash i:nth-child(3){animation-delay:.24s;background:#121212;background-image:radial-gradient(#f5f5f2 1px,transparent 1.5px);background-size:6px 6px}
      #splash i:nth-child(4){animation-delay:.36s;background:#ff5a1f;display:grid;place-items:center;font:900 26px/1 system-ui,sans-serif;font-style:normal;color:#0a0a0a}
      @keyframes drop{from{opacity:0;transform:translateY(-40px) rotate(-8deg)}}
      @media (prefers-reduced-motion:reduce){#splash i{animation:none}#splash{background-image:none}}
    </style>
  </head>
  <body>
    <div id="splash" role="progressbar" aria-label="Cargando Yomukai"><div class="strip"><i></i><i></i><i></i><i>読</i></div></div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

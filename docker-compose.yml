# Yomukai web. Settings live in .env next to this file (the install script writes it).
services:
  yomukai:
    image: ${YOMUKAI_IMAGE:-ghcr.io/nuxx-g/yomukai:latest}
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - yomukai-data:/data
      # Copia de las copias de seguridad en el NAS (montado en el VPS por Tailscale/NFS/SSHFS):
      # - /mnt/nas/yomukai-backups:/backups-nas   y en .env: BACKUP_COPY_DIR=/backups-nas
    environment:
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      GUESTS_ENABLED: ${GUESTS_ENABLED:-true}
      GUEST_DAYS: ${GUEST_DAYS:-1}
      GUEST_RATE: ${GUEST_RATE:-120}
      GUEST_STREAMS: ${GUEST_STREAMS:-2}
      ABUSE_LIMIT: ${ABUSE_LIMIT:-1500}
      GUEST_ABUSE_LIMIT: ${GUEST_ABUSE_LIMIT:-300}
      MAL_CLIENT_ID: ${MAL_CLIENT_ID:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      TZ: ${TZ:-Europe/Madrid}
      BACKUP_HOUR: ${BACKUP_HOUR:-4}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_COPY_DIR: ${BACKUP_COPY_DIR:-}
      FLARESOLVERR_URL: http://flaresolverr:8191
    depends_on:
      - flaresolverr

  # A real browser for the few sites behind Cloudflare challenges (Royal Road). Reachable only by Yomukai.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.3.21
    restart: unless-stopped
    environment:
      LOG_LEVEL: warning

volumes:
  yomukai-data:

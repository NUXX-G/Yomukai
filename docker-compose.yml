# Yomukai en el VPS. Ajustes en .env junto a este fichero (el instalador lo crea).
# Ligero a propósito: lo pesado (voces, OCR, subtítulos, descargas) lo hace el worker de casa (docker-compose.worker.yml).
#
# Tres formas de instalarlo (docs/INSTALACION.md):
#   1. Solo este servidor: lo pesado se apaga con elegancia (voces del dispositivo, +85 s para saltar el opening...).
#   2. Todo en uno: este servidor y el worker juntos en la misma máquina, si es potente. Se activa con
#      COMPOSE_PROFILES=todo-en-uno y LOCAL_WORKER_TOKEN en .env (el instalador lo hace con YOMUKAI_MODE=todo-en-uno).
#   3. VPS + worker en casa (docker-compose.worker.yml en el otro equipo, por Tailscale).
#
# Límites: el VPS es compartido (p. ej. con un portfolio) y Yomukai nunca debe dejarlo sin memoria.
#   YOMUKAI_MEMORY  memoria máxima del contenedor (1g por defecto; la JVM usa el 55 % para el heap)
#   YOMUKAI_CPUS    núcleos como máximo (1.0 por defecto)
# Si aun así faltara memoria, oom_score_adj hace que el kernel mate antes a Yomukai que a otro servicio,
# y Docker lo vuelve a arrancar solo.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  yomukai:
    image: ${YOMUKAI_IMAGE:-ghcr.io/nuxx-g/yomukai:latest}
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - yomukai-data:/data
      # Copia de las copias de seguridad en el NAS (montado en el VPS por Tailscale/NFS/SSHFS):
      # - /mnt/nas/yomukai-backups:/backups-nas   y en .env: BACKUP_COPY_DIR=/backups-nas
    mem_limit: ${YOMUKAI_MEMORY:-1g}
    memswap_limit: ${YOMUKAI_MEMORY_SWAP:-1500m}
    cpus: ${YOMUKAI_CPUS:-1.0}
    pids_limit: 512
    oom_score_adj: 500
    security_opt:
      - no-new-privileges:true
    logging: *logging
    environment:
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      GUESTS_ENABLED: ${GUESTS_ENABLED:-false}
      GUEST_DAYS: ${GUEST_DAYS:-1}
      GUEST_RATE: ${GUEST_RATE:-120}
      GUEST_STREAMS: ${GUEST_STREAMS:-2}
      ABUSE_LIMIT: ${ABUSE_LIMIT:-1500}
      GUEST_ABUSE_LIMIT: ${GUEST_ABUSE_LIMIT:-300}
      MAL_CLIENT_ID: ${MAL_CLIENT_ID:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      AUTH_RATE: ${AUTH_RATE:-30}
      IP_RATE: ${IP_RATE:-1200}
      PUBLIC_URL: ${PUBLIC_URL:-}
      TZ: ${TZ:-Europe/Madrid}
      BACKUP_HOUR: ${BACKUP_HOUR:-4}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_COPY_DIR: ${BACKUP_COPY_DIR:-}
      RESULT_CACHE_MB: ${RESULT_CACHE_MB:-2048}
      IMAGE_CACHE_MB: ${IMAGE_CACHE_MB:-2048}
      BANDWIDTH_CAP_GB: ${BANDWIDTH_CAP_GB:-0}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      NTFY_URL: ${NTFY_URL:-}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      FLARESOLVERR_URL: http://flaresolverr:8191
      NAS_UPLOAD_MBPS: ${NAS_UPLOAD_MBPS:-20}
      # Todo en uno: el worker de este mismo compose entra con este token (se registra solo al arrancar).
      LOCAL_WORKER_TOKEN: ${LOCAL_WORKER_TOKEN:-}
    depends_on:
      - flaresolverr

  # Todo en uno: el worker en la misma máquina, con prioridad baja y sus propios límites para no ahogar al servidor.
  # Solo arranca con COMPOSE_PROFILES=todo-en-uno. Habla con Yomukai por la red interna de Docker (no sale a internet).
  worker:
    profiles: ["todo-en-uno"]
    image: ${YOMUKAI_WORKER_IMAGE:-ghcr.io/nuxx-g/yomukai-worker:latest}
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    mem_limit: ${WORKER_MEMORY:-2g}
    cpus: ${WORKER_CPUS:-1.5}
    cpu_shares: 256
    pids_limit: 1024
    security_opt:
      - no-new-privileges:true
    logging: *logging
    environment:
      YOMUKAI_URL: http://yomukai:8080
      WORKER_TOKEN: ${LOCAL_WORKER_TOKEN:-}
      WORKER_ENGINES: ${WORKER_ENGINES:-}
      TZ: ${TZ:-Europe/Madrid}
    volumes:
      - worker-work:/work
      # Bibliotecas de Jellyfin y carpeta de cómics, si están en esta máquina:
      # - /srv/media/anime:/media/anime
      # - /srv/media/comics:/media/comics
    depends_on:
      - yomukai

  # Un navegador real para las pocas webs con desafío de Cloudflare. Solo lo ve Yomukai.
  # Chrome es lo que más memoria gasta: con límite propio y reinicio automático si se pasa.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.3.21
    restart: unless-stopped
    mem_limit: ${FLARESOLVERR_MEMORY:-512m}
    cpus: ${FLARESOLVERR_CPUS:-0.5}
    pids_limit: 256
    oom_score_adj: 800
    logging: *logging
    environment:
      LOG_LEVEL: warning

volumes:
  yomukai-data:
  worker-work:

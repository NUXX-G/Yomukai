# Se aplica encima de la configuración por defecto de detekt (--build-upon-default-config).
# Lo que ya existía está en config/detekt-baseline.xml: la CI solo falla con problemas nuevos.
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][_A-Z0-9]*'
style:
  MaxLineLength:
    maxLineLength: 200
  MagicNumber:
    active: false
  WildcardImport:
    active: false
  ReturnCount:
    max: 4
  LoopWithTooManyJumpStatements:
    maxJumpCount: 3
  ThrowsCount:
    max: 4
performance:
  SpreadOperator:
    active: false
complexity:
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 12
    ignoreDefaultParameters: true
  TooManyFunctions:
    active: false
  NestedBlockDepth:
    threshold: 5
  LongMethod:
    threshold: 120
  CyclomaticComplexMethod:
    threshold: 20
exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false

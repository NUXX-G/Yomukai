# Se aplica encima de la configuración por defecto de detekt (--build-upon-default-config).
# Lo que ya existía está en config/detekt-baseline.xml: la CI solo falla con problemas nuevos.
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][_A-Z0-9]*'
style:
  MaxLineLength:
    maxLineLength: 160
  MagicNumber:
    active: false
  WildcardImport:
    active: false
  ReturnCount:
    max: 4
complexity:
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 12
    ignoreDefaultParameters: true
  TooManyFunctions:
    active: false

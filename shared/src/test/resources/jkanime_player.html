	function modal_confirm(titulo = false, msj = false, callback = false, callback_cancel = false) {
	if(times_modal == 0) {

	modal.id = 'confirm_modal';
	document.body.appendChild(modal);
	var ModalData=document.getElementById("confirm_modal");
	var boton='';
	var boton='<a href="#" id="acp">Aceptar</a>';
	ModalData.innerHTML='<div id="modal-back"></div><div class="modal"><div id="modal-c"><h3>'+titulo+'</h3><span id="mc">'+msj+'</span><div id="buttons"><a id="mclose" href="#">Cancelar</a>'+boton+'</div></div></div>';
	document.querySelector(".modal").style.height=document.getElementById("mc").offsetHeight+100+'px';
	document.getElementById('mclose').onclick=function(){ModalData.remove();callback_cancel();return false;};
	document.getElementById('acp').onclick=function(){ModalData.remove();callback();return false;};
	}
	times_modal++;
	}

     function addskip() {
            const noticePlayer = document.querySelector('.dplayer-notice');

                            skipBtn.style.display = "none";

	function update_jkstatus() {
	setInterval(function(){

	var new_time = {'time': jkplayer.currentTime, 'hash': hash};
	//Si no existe se crea
	if (!jkplayer_status.find(o => o.hash === hash)) {
	if(jkplayer.currentTime > 5) {
	jkplayer_status.push(new_time);
	cacheLocal.setItem('remember_players', JSON.stringify(jkplayer_status));
	}
	} else {
	//Si existe se actualiza
	jkplayer_status[jkplayer_status.findIndex(o => o.hash === hash)]['time'] = jkplayer.currentTime;
	cacheLocal.setItem('remember_players', JSON.stringify(jkplayer_status));

	}
	}, 1000);

	}

	//Pregunta si quiere continuar

	jkplayer.currentTime = player_newtime;
	jkplayer.play();

	update_jkstatus();
	}, function() {
	update_jkstatus();
	});

	} else {
	//Si no hay info, crea o actualiz
	update_jkstatus();

        let lastSentTime = 0;
        let opButtonShow = false;

        dp.on('timeupdate', () => {
            const currentTime = document.querySelector('.dplayer-video').currentTime;
            const duration = document.querySelector('.dplayer-video').duration;
            const percent = (currentTime / duration) * 100;

            // Enviar el tiempo al padre (evitando saturación de mensajes)
            if (Math.abs(currentTime - lastSentTime) >= 0.5) { // Enviar cada 0.5s
                window.parent.postMessage({
                    action: 'history_play',
                    time: percent,
                }, '*'); // Usa tu dominio en lugar de '*' en producción
                lastSentTime = currentTime;
            }
        });


        dp.on('playing', function() {

# Actualizaciones de dependencias semanales, agrupadas para no llenar de PRs.
version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      gradle-menores:
        update-types: ["minor", "patch"]
    ignore:
      # Desde 0.4.9.14 exige un minSdk mayor: dejaría fuera los móviles con Android 8 que la app soporta.
      - dependency-name: "info.guardianproject:tor-android"
        versions: [">= 0.4.9.14"]
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-menores:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      acciones:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    ignore:
      # Solo versiones LTS de Node (las impares no tienen soporte largo).
      - dependency-name: "node"
        versions: ["25", "27", "29"]

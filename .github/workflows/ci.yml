# Build, pruebas y lint de todo el repo en cada push y PR: shared + server (JVM), app Android y web.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kotlin-lint:
    name: Kotlin (detekt + ktlint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v4
        with:
          path: .lint-tools
          key: lint-tools-${{ hashFiles('scripts/lint-kotlin.sh') }}
      - run: bash scripts/lint-kotlin.sh

  jvm:
    name: shared + server + worker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      YOMUKAI_SERVER_ONLY: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Pruebas y build
        run: ./gradlew :shared:test :server:test :worker:test :server:installDist :worker:installDist --console=plain
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informes-jvm-${{ github.sha }}
          path: "*/build/reports/tests/"
          retention-days: 7

  android:
    name: App Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # sherpa-onnx (voces del móvil): se descarga una vez de sus releases y se guarda; si GitHub falla, se usa la copia.
      - uses: actions/cache@v4
        with:
          path: .android-libs
          key: android-libs-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: android-libs-
      - name: SDK de Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" >/dev/null
      # Misma firma que Android Studio: así el APK actualiza la app instalada sin borrar tus datos.
      - name: Firma de depuración
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          fi
      - run: chmod +x gradlew
      - name: Compilar
        run: ./gradlew assembleDebug --stacktrace --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: yomukai-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
      - name: Pruebas
        run: ./gradlew testDebugUnitTest --console=plain
      - name: Tamaño del APK
        run: |
          ls -l app/build/outputs/apk/debug/*.apk | awk '{printf "APK debug: %.1f MB\n", $5/1048576}' >> "$GITHUB_STEP_SUMMARY"

  web:
    name: Web (svelte-check + eslint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run check
      - run: npm run build
      - name: Tamaño del bundle
        run: |
          echo "### Bundle web (gzip)" >> "$GITHUB_STEP_SUMMARY"
          for f in dist/assets/*.js dist/assets/*.css; do
            printf -- "- %s: %s KB\n" "$(basename "$f")" "$(gzip -c "$f" | wc -c | awk '{printf "%.1f", $1/1024}')" >> "$GITHUB_STEP_SUMMARY"
          done

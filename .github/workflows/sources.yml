# Firma el paquete de fuentes declarativas cuando cambia algún sources/*.json en main (p. ej. al aceptar un PR de
# auto-reparación). La clave privada está en el secreto SOURCES_SIGNING_KEY, nunca en el repositorio.
# Para activarlo: gh secret set SOURCES_SIGNING_KEY < ~/.yomukai/sources-signing.key
name: Firmar fuentes

on:
  push:
    branches: [main]
    paths: ["sources/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sign-sources
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Firmar
        env:
          SOURCES_SIGNING_KEY: ${{ secrets.SOURCES_SIGNING_KEY }}
        run: |
          if [ -z "$SOURCES_SIGNING_KEY" ]; then
            echo "::warning::Falta el secreto SOURCES_SIGNING_KEY: firma en local con java scripts/SignSources.java y sube el paquete"
            exit 0
          fi
          java scripts/SignSources.java
      - name: Subir el paquete firmado
        run: |
          if git diff --quiet -- shared/src/main/resources/sources; then echo "Sin cambios"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/src/main/resources/sources
          git commit -m "chore(fuentes): firmar paquete de fuentes"
          git pull --rebase origin main
          git push origin HEAD:main

# Publica las imágenes en GitHub Container Registry al subir a main, para instalar sin compilar:
#   ghcr.io/nuxx-g/yomukai          (VPS)
#   ghcr.io/nuxx-g/yomukai-worker   (servidor de casa)
name: Imágenes Docker

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "app/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        include:
          - image: yomukai
            file: Dockerfile
          - image: yomukai-worker
            file: Dockerfile.worker
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/nuxx-g/${{ matrix.image }}:latest
            ghcr.io/nuxx-g/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

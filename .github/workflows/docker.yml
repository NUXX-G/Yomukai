# Publica las imágenes en GitHub Container Registry al subir a main, para instalar sin compilar:
#   ghcr.io/nuxx-g/yomukai          (VPS)
#   ghcr.io/nuxx-g/yomukai-worker   (servidor de casa: ffmpeg, Chromaprint, OCR)
#   ghcr.io/nuxx-g/yomukai-worker-full   (además voces con Pocket TTS y subtítulos con whisper.cpp)
name: Imágenes Docker

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "app/**"]
  workflow_dispatch:
  # PRs that touch the images only build them (nothing is published), so a base image bump is checked first.
  pull_request:
    paths: ["Dockerfile", "Dockerfile.worker", "docker-compose*.yml"]

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      matrix:
        include:
          - image: yomukai
            file: Dockerfile
          - image: yomukai-worker
            file: Dockerfile.worker
            args: ""
          - image: yomukai-worker-full
            file: Dockerfile.worker
            args: |
              WITH_TTS=true
              WITH_WHISPER=true
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: ${{ matrix.args }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/nuxx-g/${{ matrix.image }}:latest
            ghcr.io/nuxx-g/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,mode=max,scope={0}', matrix.image) || '' }}
